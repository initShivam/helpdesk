services:
  - type: web
    name: helpdesk-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    preDeployCommand: python manage.py migrate
    dockerCommand: >-
      sh -c "python manage.py collectstatic --noinput && exec gunicorn helpdesk.wsgi:application
      --bind 0.0.0.0:${PORT:-10000} --workers ${WEB_CONCURRENCY:-3} --access-logfile - --error-logfile -"
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: helpdesk-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: helpdesk-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: helpdesk-redis
          type: keyvalue
          property: connectionString
      - key: PGVECTOR_ENABLED
        value: "True"
      - key: MEDIA_STORAGE_BACKEND
        value: s3
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        value: ""
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: EMBEDDING_PROVIDER
        value: ollama
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_EMBEDDING_MODEL
        value: nomic-embed-text
      - key: EMAIL_IMAP_USERNAME
        sync: false
      - key: EMAIL_IMAP_PASSWORD
        sync: false

  - type: web
    name: helpdesk-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    rootDir: ./frontend
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: same-origin

  - type: worker
    name: helpdesk-celery
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    dockerCommand: celery -A helpdesk worker -l INFO --concurrency=2
    envVars: &backendEnv
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          name: helpdesk-api
          type: web
          envVarKey: DJANGO_ALLOWED_HOSTS
      - key: FRONTEND_URL
        fromService:
          name: helpdesk-api
          type: web
          envVarKey: FRONTEND_URL
      - key: DJANGO_SECRET_KEY
        fromService:
          name: helpdesk-api
          type: web
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: helpdesk-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: helpdesk-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: helpdesk-redis
          type: keyvalue
          property: connectionString
      - key: PGVECTOR_ENABLED
        value: "True"
      - key: OPENAI_API_KEY
        fromService:
          name: helpdesk-api
          type: web
          envVarKey: OPENAI_API_KEY
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: EMBEDDING_PROVIDER
        value: ollama
      - key: OLLAMA_BASE_URL
        fromService:
          name: helpdesk-api
          type: web
          envVarKey: OLLAMA_BASE_URL
      - key: OLLAMA_EMBEDDING_MODEL
        value: nomic-embed-text
      - key: EMAIL_IMAP_USERNAME
        fromService:
          name: helpdesk-api
          type: web
          envVarKey: EMAIL_IMAP_USERNAME
      - key: EMAIL_IMAP_PASSWORD
        fromService:
          name: helpdesk-api
          type: web
          envVarKey: EMAIL_IMAP_PASSWORD
      - key: MEDIA_STORAGE_BACKEND
        value: s3
      - key: AWS_STORAGE_BUCKET_NAME
        fromService:
          name: helpdesk-api
          type: web
          envVarKey: AWS_STORAGE_BUCKET_NAME
      - key: AWS_S3_REGION_NAME
        fromService:
          name: helpdesk-api
          type: web
          envVarKey: AWS_S3_REGION_NAME
      - key: AWS_S3_ENDPOINT_URL
        fromService:
          name: helpdesk-api
          type: web
          envVarKey: AWS_S3_ENDPOINT_URL
      - key: AWS_ACCESS_KEY_ID
        fromService:
          name: helpdesk-api
          type: web
          envVarKey: AWS_ACCESS_KEY_ID
      - key: AWS_SECRET_ACCESS_KEY
        fromService:
          name: helpdesk-api
          type: web
          envVarKey: AWS_SECRET_ACCESS_KEY

  - type: worker
    name: helpdesk-celery-beat
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    dockerCommand: celery -A helpdesk beat -l INFO --schedule=/tmp/celerybeat-schedule
    envVars: *backendEnv

  - type: keyvalue
    name: helpdesk-redis
    region: singapore
    plan: 256mb
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []

databases:
  - name: helpdesk-db
    region: singapore
    postgresMajorVersion: "16"
    databaseName: helpdesk
